<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7000FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF007A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#7000FF;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background hexagon -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#0c0e17" stroke="url(#grad1)" stroke-width="3" filter="url(#shadow)"/>

  <!-- Inner accent lines -->
  <polygon points="50,14 84,31 84,69 50,86 16,69 16,31" fill="none" stroke="#1f253d" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Stylized R + V (Runvoid) Symbol -->
  <path d="M 32 30 L 52 30 C 62 30 68 35 68 43 C 68 50 62 55 52 55 L 42 55 L 42 70" fill="none" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 52 55 L 68 70" fill="none" stroke="url(#grad1)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Glowing core dot -->
  <circle cx="50" cy="50" r="3" fill="#00F0FF"/>
</svg>

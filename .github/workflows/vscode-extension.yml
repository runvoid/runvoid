name: VS Code Extension

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

jobs:
  package:
    name: Package VS Code VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies and Package Extension
        working-directory: editors/vscode
        run: |
          npm install -g @vscode/vsce
          vsce package --no-git-tag-version --no-update-package-json --out ../../runvoid-vscode.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: runvoid-vscode-extension
          path: runvoid-vscode.vsix

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: runvoid-vscode.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
